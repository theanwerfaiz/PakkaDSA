name: CI
on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check:licences
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run check:golden
      - run: npm run check:snippets
      - run: npm run build
      - run: npm run check:budget
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Lighthouse on shared runners varies with their CPU speed, so here it reports rather than
      # gates; the release gate is `npm run lighthouse` (see docs/spec 09 §1.6 and docs/DECISIONS.md).
      - run: npm run lighthouse
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
